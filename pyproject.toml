[project]
name = "caspian-warehouse"
version = "0.1.0"
description = "Offline-first intelligent inventory management system"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Alireza", email = "alireza.molayari@gmail.com" }]
dependencies = [
    "PySide6-Essentials>=6.8",
    "qasync>=0.27",
    "jdatetime>=5.0",
    "platformdirs>=4.2",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "keyring>=25",
    "argon2-cffi>=23.1",
]

[project.scripts]
caspian = "caspian.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.uv]
# Keep the download cache on the project drive (C: is nearly full on the dev machine).
cache-dir = ".uv-cache"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caspian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # Persian/Arabic characters are intentional

[tool.ruff.lint.per-file-ignores]
"src/caspian/db/migrations/versions/*" = ["E501", "W291"]  # generated
"src/caspian/ui/theme.py" = ["E501"]  # stylesheet template reads better unwrapped
