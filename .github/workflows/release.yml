name: Release

# Tag v1.2.3 (matching pyproject.toml)  -> build, test and publish a GitHub Release.
# Push to a branch named release-*      -> same build and tests, no publishing (dry run).
# Manual run (Actions tab)              -> dry run of the default branch.
on:
  push:
    tags: ["v*.*.*"]
    branches: ["release-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync

      - name: Version must match the tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = (uv run python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])").Trim()
          if ("v$v" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version in pyproject.toml ($v). Update pyproject.toml or the tag."
          }

      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest -q

      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File packaging\build.ps1 -DownloadMariaDb

      - name: Test installer (install with database server, run, uninstall)
        timeout-minutes: 25
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\installer\CaspianWarehouse-Setup-*.exe | Select-Object -First 1
          $pw = "Ci-" + [guid]::NewGuid().ToString("N")
          powershell -ExecutionPolicy Bypass -File packaging\test_installer.ps1 -Installer $exe.FullName `
            -WithDatabase -DbPassword $pw -InstallDir "$env:RUNNER_TEMP\caspian-install"
          if ($LASTEXITCODE -ne 0) { throw "installer tests failed ($LASTEXITCODE)" }

      - uses: actions/upload-artifact@v4
        with:
          name: CaspianWarehouse-installer
          path: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Caspian Warehouse ${{ github.ref_name }}
          files: |
            dist/installer/*.exe
            dist/installer/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Download
            Download **CaspianWarehouse-Setup-….exe** from the **Assets** list below (Windows 10/11, 64-bit).
            Installation steps: see the [README](https://github.com/${{ github.repository }}#download--install).
