name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - name: Tests
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          uv run pytest -q -rf --tb=line 2>&1 | Tee-Object -FilePath pytest.log
          $code = $LASTEXITCODE
          # Surface failures as annotations (readable without downloading logs).
          Select-String -Path pytest.log -Pattern '^(FAILED|ERROR) |^E:\\|^[A-Za-z]:\\.*:\d+: ' |
            Select-Object -First 30 | ForEach-Object { Write-Output "::error::$($_.Line)" }
          exit $code
